<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="row p-0 m-0">
      <div class="col-md-12 display-3 d-flex justify-content-center">
        Invoice
      </div>
      <div class="col-md-12 h5 d-flex justify-content-end">
        Date: 3rd Jan 2026
      </div>
      <div class="col-md-12 p-0 m-0 card border shadow">
        <div class="row p-3">
          <div class="col-md-6 p-0 m-0">
            <p>Company Name</p>
            <p>GST Number:</p>
            <p>Address:</p>
            <p>Phone:</p>
          </div>
          <div class="col-md-6 p-0 m-0">
            <p>Customer Name</p>
            <p>GST Number:</p>
            <p>Phone:</p>
          </div>
        </div>
      </div>

      <div class="col-md-12 p-0 m-0 card border shadow p-5">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>#</th>
              <th>Item</th>
              <th>Qty</th>
              <th>Price</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Item name</td>
              <td>10</td>
              <td>25680</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
